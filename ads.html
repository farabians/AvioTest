<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvioTest - PACE, CASE & MOLLYMAWK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --primary-red: #ff0000;
            --bg-color: #050505;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif !important;
            background-color: #050505 !important;
            color: white !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background: 
                radial-gradient(circle at 80% 20%, rgba(255, 0, 0, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 74, 255, 0.08) 0%, transparent 40%),
                #050505 !important;
            /* Padding and margin removed to allow global styles to apply 140px space */
            margin: 0 !important;
        }

        #header-placeholder {
            width: 100%;
        }

        #footer-placeholder {
            width: 100%;
            margin-top: auto;
        }

        /* Bannerları gizle ve Header'ı en tepeye yapıştır */
        .top-notice-banner, 
        .mobile-notice-banner {
            display: none !important;
        }

        .header {
            top: 0 !important;
        }

        body {
            padding-top: 100px !important;
        }

        @media (max-width: 992px) {
            .header {
                top: 0 !important;
            }
            body {
                padding-top: 80px !important;
            }
        }

        /* Overriding styles cleared */

        .add-page-container {
            width: 100%;
            max-width: 1300px;
            padding: 40px 20px; /* Adjusted to sit nicely at the top */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex-grow: 1;
            margin: 0 auto;
        }

        .logo-container {
            margin-top: 20px;
            margin-bottom: 80px;
            z-index: 20;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.1));
        }

        .hero-logo {
            height: 70px;
            width: auto;
        }

        .hero-section {
            display: flex;
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1100px;
            position: relative;
            z-index: 20;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            text-align: left; /* Keeping it left aligned as per image, but centralizing the group */
            flex: 0 1 auto;
            position: relative;
            z-index: 25;
        }

        .pill-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ccc;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            width: fit-content;
            white-space: nowrap; /* Yazının aşağı düşmesini engeller */
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 5px rgba(255, 0, 0, 0.1);
                border-color: rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
                border-color: rgba(255, 0, 0, 0.5);
                color: #fff;
            }
        }

        .text-line {
            font-weight: 900;
            font-size: 3.2rem; 
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-red {
            background: linear-gradient(180deg, #ff4141 0%, #8b0000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .price-group {
            display: flex;
            align-items: baseline;
            line-height: 0.8;
            margin-top: 30px;
            position: relative;
            padding-left: 15px;
            border-left: 3px solid var(--primary-red);
        }

        .price-number {
            font-size: 7.5rem; 
            font-weight: 950;
            letter-spacing: -4px;
            line-height: 0.9;
            color: white;
            filter: drop-shadow(0 0 30px rgba(255,255,255,0.1));
        }

        .price-unit {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-left: 2px;
            letter-spacing: -0.5px;
        }

        .price-period {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
        }

        .mockup-container {
            flex: 0 1 auto;
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 10;
            margin-left: -20px; /* Boşluk dengelendi */
            filter: drop-shadow(0 40px 80px rgba(0,0,0,0.6));
        }

        .mockup-img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        .mockup-container:hover .mockup-img {
            transform: scale(1.05);
        }

        /* Bottom Content Styles Refined */
        .bottom-content {
            text-align: center;
            margin: 10px auto 100px;
            width: 100%;
            max-width: 1000px;
            z-index: 20;
        }

        .bottom-title {
            font-size: 2.2rem;
            font-weight: 950;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: -1px;
            line-height: 1;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            width: 100%;
        }

        .feature-list {
            list-style: none;
            padding: 0;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .feature-item {
            font-size: 1rem;
            font-weight: 600;
            color: #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex: 0 1 auto;
            min-width: 150px;
        }

        .feature-item::before {
            display: none; /* Standart tık ikonu kaldırıldı */
        }

        .feature-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            min-width: 45px;
            height: 45px;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.2) 0%, rgba(139, 0, 0, 0.4) 100%);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff4141;
            border-radius: 12px;
            margin-bottom: 5px;
            padding: 0 10px;
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.15);
            transition: all 0.3s ease;
            gap: 8px;
        }

        .feature-item:hover .feature-icon {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.4) 0%, rgba(139, 0, 0, 0.6) 100%);
            box-shadow: 0 12px 25px rgba(255, 0, 0, 0.3);
            color: white;
        }

        .feature-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .device-badge-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .device-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            gap: 6px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            min-width: 85px;
        }

        .device-box:hover {
            background: rgba(255, 0, 0, 0.05);
            border-color: rgba(255, 0, 0, 0.2);
            transform: translateY(-5px);
        }

        .device-box svg {
            width: 20px;
            height: 20px;
            fill: #ccc;
            transition: all 0.3s ease;
        }

        .device-box:hover svg {
            fill: #ff0000;
        }

        .device-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .device-box:hover .device-label {
            color: #fff;
        }

        /* Feature-specific hover animations */
        .feature-item:hover .feature-icon svg:nth-child(1) { transform: translateY(-3px) scale(1.1); }
        .feature-item:hover .feature-icon svg:nth-child(2) { transform: translateY(-5px) scale(1.15) rotate(-90deg); transition-delay: 0.1s; }
        .feature-item:hover .feature-icon svg:nth-child(3) { transform: translateY(-3px) scale(1.1); transition-delay: 0.2s; }

        /* Histogram Anim */
        .feature-item:hover .bar-1 { animation: grow-bar 0.6s ease-out forwards; }
        .feature-item:hover .bar-2 { animation: grow-bar 0.8s ease-out forwards 0.1s; }
        .feature-item:hover .bar-3 { animation: grow-bar 0.7s ease-out forwards 0.2s; }

        @keyframes grow-bar {
            from { transform: scaleY(0); transform-origin: bottom; }
            to { transform: scaleY(1); transform-origin: bottom; }
        }

        .cta-buttons {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
        }

        .cta-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: auto;
        }

        .store-btn-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: white;
            padding: 10px 20px; /* Reduced from 14px 28px */
            border-radius: 12px;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
        }

        .store-btn-custom:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        .store-btn-custom img {
            height: 22px; /* Reduced from 28px */
        }

        .store-btn-text span {
            display: block;
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }

        .store-btn-text strong {
            font-size: 1rem;
            font-weight: 700;
        }

        .get-now-btn {
            background: linear-gradient(135deg, #ff0000 0%, #b30000 100%);
            color: white;
            text-decoration: none;
            padding: 16px 45px; /* Reduced from 22px 60px */
            border-radius: 14px;
            font-weight: 950;
            font-size: 1.3rem; /* Reduced from 1.6rem */
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.25);
        }

        .get-now-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 25px 50px rgba(255, 0, 0, 0.4);
            filter: brightness(1.1);
        }

        .social-btn-custom {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: white;
            padding: 10px 20px; /* Store butonlarıyla eşitlendi */
            border-radius: 12px;
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            min-width: 170px; /* Genişlik dengelendi */
        }

        .social-btn-custom svg {
            width: 22px; /* Store ikonlarıyla eşitlendi */
            height: 22px;
            fill: currentColor;
        }

        /* WhatsApp Style & Color */
        .wa-custom {
            border-color: rgba(37, 211, 102, 0.3);
            background: rgba(37, 211, 102, 0.05);
        }
        .wa-custom strong { color: #25D366; }
        .wa-custom svg { color: #25D366; }
        .wa-custom:hover {
            background: rgba(37, 211, 102, 0.15);
            border-color: #25D366;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.2);
        }

        /* Instagram Style & Color */
        .ig-custom {
            border-color: rgba(225, 48, 108, 0.3);
            background: rgba(225, 48, 108, 0.05);
        }
        .ig-custom strong { color: #E1306C; }
        .ig-custom svg { color: #E1306C; }
        .ig-custom:hover {
            background: rgba(225, 48, 108, 0.15);
            border-color: #E1306C;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(225, 48, 108, 0.2);
        }

        @media (max-width: 992px) {
            body {
                min-height: 100vh;
                overflow-x: hidden;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }
            .add-page-container {
                padding: 0 7% 80px 5%; 
                min-height: unset;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                flex: none;
                margin-top: 10px;
            }
            .hero-section {
                flex-direction: column; 
                align-items: center;
                justify-content: center; 
                gap: 15px; 
                padding: 0;
                width: 100%;
                margin-bottom: 10px;
            }
            .text-group { 
                flex: 0 1 auto;
                text-align: center;
                align-items: center;
                min-width: 0; 
                width: 100%;
            }
            .text-line {
                font-size: clamp(1.3rem, 6.5vw, 1.8rem) !important; 
                letter-spacing: -0.5px;
                line-height: 1.1;
            }
            .pill-badge {
                font-size: 0.6rem;
                padding: 4px 10px;
                margin-bottom: 12px;
                margin-left: auto;
                margin-right: auto;
            }
            .price-group { 
                justify-content: center;
                border: none;
                border-bottom: 2px solid var(--primary-red);
                padding: 0 0 5px 0;
                margin: 12px auto 0;
                width: fit-content;
            }
            .price-number { font-size: clamp(3.5rem, 13vw, 5rem) !important; }
            .price-unit { 
                font-size: 0.9rem;
                width: 0;
                white-space: nowrap;
                margin-left: 5px;
            }
            .mockup-container { 
                flex: 0 1 auto; 
                margin: 0 auto; 
                max-width: 80%;
                z-index: 5;
            }
            .bottom-content { 
                margin: 0 auto;
                padding: 0;
                width: 100%;
            }
            .bottom-title { 
                font-size: clamp(1rem, 4vw, 1.4rem) !important; 
                margin-bottom: 10px; 
            }
            .feature-list { 
                display: flex;
                flex-direction: row; 
                justify-content: center;
                gap: 5px; 
                margin-bottom: 15px;
                flex-wrap: wrap; /* İkonların kaybolmasını önlemek için sarmala izin verildi */
            }
            .feature-item {
                font-size: 0.7rem;
                min-width: 100px; /* Minimum genişlik verilerek ikonların ezilmesi önlendi */
                flex: 1 1 30%;
                gap: 8px;
            }
            .feature-icon {
                width: auto; 
                min-width: 42px; 
                height: 38px; 
                border-radius: 10px;
                padding: 0 10px; 
                gap: 5px; 
            }
            .feature-icon svg {
                width: 16px; 
                height: 16px;
            }
            .device-badge-group {
                gap: 6px;
                margin-bottom: 20px;
                width: 100%;
                justify-content: center;
            }
            .device-box {
                padding: 8px 10px;
                min-width: 65px;
                border-radius: 8px;
                gap: 4px;
            }
            .device-box svg {
                width: 14px;
                height: 14px;
            }
            .device-label {
                font-size: 0.5rem;
                letter-spacing: 0.5px;
            }
            .cta-buttons {
                flex-direction: column; 
                gap: 15px;
                justify-content: center;
            }
            .cta-row {
                display: flex;
                flex-direction: row;
                flex-wrap: nowrap;
                gap: 10px;
                width: 100%;
                justify-content: center;
            }
            .store-btn-custom, .social-btn-custom {
                padding: 8px 12px;
                border-radius: 10px;
                flex: 1 1 50%;
                min-width: 140px;
                max-width: 180px;
                justify-content: flex-start;
            }
            .store-btn-custom img, .social-btn-custom svg {
                height: 18px;
                width: 18px;
            }
            .store-btn-text span { font-size: 0.5rem; }
            .store-btn-text strong { font-size: 0.85rem; }
            .get-now-btn { 
                padding: 12px 25px; 
                font-size: 1rem; 
                border-radius: 12px;
                flex: 1 1 100%; /* Mobil ekranda "Get Now" butonu tam genişlik veya orta vurgu */
                order: -1; /* Görsel hiyerarşide yukarı taşındı */
                margin-bottom: 5px;
            }
            .social-links {
                margin-top: 25px;
                padding-top: 20px;
                gap: 12px;
            }
            .social-btn {
                padding: 8px 15px;
                font-size: 0.75rem;
            }
        }

        /* Exclusive Banner Styles */
        .exclusive-banner {
            width: 100%;
            background: linear-gradient(180deg, rgba(20, 20, 20, 0) 0%, rgba(255, 0, 0, 0.05) 50%, rgba(20, 20, 20, 0) 100%);
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            margin: 40px 0;
            position: relative;
            z-index: 20;
        }

        .exclusive-badge {
            background: #ff3131;
            color: white;
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .exclusive-banner h3 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            max-width: 800px;
            margin: 0 auto 35px;
            line-height: 1.3;
        }

        .exclusive-banner .highlight {
            color: #ffcc00; /* Golden yellow */
        }

        .claim-btn {
            background: white;
            color: #050505;
            padding: 16px 45px;
            border-radius: 100px;
            font-weight: 750;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
        }

        .claim-btn:hover {
            transform: scale(1.05) translateY(-3px);
            background: #f0f0f0;
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 992px) {
            .exclusive-banner {
                padding: 40px 15px;
                margin: 20px 0;
            }
            .exclusive-banner h3 {
                font-size: 1.1rem;
                margin-bottom: 25px;
            }
            .exclusive-badge {
                font-size: 0.7rem;
                padding: 3px 10px;
                margin-bottom: 15px;
            }
            .claim-btn {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 992px) {
            /* Styles already integrated into 992px for "no scroll" consistency */
        }

        @media (max-width: 768px) {
            /* Styles already integrated into 992px for "no scroll" consistency */
        }

        @media (max-width: 480px) {
            /* Styles integrated */
        }

        /* Airplane Animation Styles */
        .airplane-animation-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .airplane-entity {
            position: absolute;
            width: 48px;
            height: auto;
            opacity: 0; /* Managed by animation */
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
            animation: plane-flight linear infinite;
            pointer-events: none;
        }

        .airplane-entity img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.12; /* Subtle visibility */
        }

        .airplane-trail {
            position: absolute;
            bottom: 20%;
            right: 80%; 
            width: 300px;
            height: 1px;
            background: linear-gradient(to left, rgba(255, 255, 255, 0.08), transparent);
            opacity: 0.4;
            filter: blur(1px);
            transform: rotate(-35deg); /* Align trail with diagonal movement if plane points up-right */
            transform-origin: right center;
        }

        .airplane-trail.alt {
            bottom: 40%;
            width: 200px;
            opacity: 0.2;
        }

        @keyframes plane-flight {
            0% {
                left: -200px;
                top: 110%;
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                left: 110%;
                top: -200px;
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="airplane-animation-layer">
        <div class="airplane-entity" style="animation-duration: 45s; animation-delay: 0s;">
            <img src="images/plane_white.png" alt="Airplane">
            <div class="airplane-trail"></div>
            <div class="airplane-trail alt"></div>
        </div>
        <div class="airplane-entity" style="animation-duration: 65s; animation-delay: -30s; width: 32px;">
            <img src="images/plane_white.png" alt="Airplane">
            <div class="airplane-trail"></div>
            <div class="airplane-trail alt"></div>
        </div>
    </div>
    <div id="header-placeholder"></div>

    <div class="add-page-container">
        <div class="hero-section">
            <div class="text-group">
                <div class="pill-badge">LIMITED TIME OFFER </div> 
                <div class="text-line">PACE, CASE &</div>
                <div class="text-line">MOLLYMAWK</div>
                <div class="text-line text-red">ALL-IN-ONE</div>
